# Solución del lab 08: API .NET + SQL Server + nginx como proxy inverso.
# Arranque:  docker compose up -d --build
# Parada:    docker compose down          (conserva los datos)
#            docker compose down -v       (borra también el volumen de datos)

name: convocatorias

services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./ConvocatoriasApi
    image: convocatorias-api:1.0.0
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Mensaje: "Hola desde Docker Compose"
      ConnectionStrings__Convocatorias: "Server=db;Database=Convocatorias;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - frontend
    restart: unless-stopped

volumes:
  sqldata:

networks:
  backend:
  frontend:
